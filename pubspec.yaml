name: flutter_event_kit
description: "Type-safe access to the EventKit API on iOS and macOS."
version: 0.0.1

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^13.0.0

flutter:
  
  plugin:
    platforms:
      ios:
        pluginClass: FlutterEventKitPlugin
      macos:
        pluginClass: FlutterEventKitPlugin

  
